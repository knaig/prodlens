n><h3>assets/screenshots-_sip_strategy.png</h3><img src=\"assets/screenshots-_sip_strategy.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip_studio_new.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip_studio_new.png</h3><img src=\"assets/screenshots-_sip_studio_new.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip_studio_sp1.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip_studio_sp1.png</h3><img src=\"assets/screenshots-_sip_studio_sp1.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip_studio_sp2.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip_studio_sp2.png</h3><img src=\"assets/screenshots-_sip_studio_sp2.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip_studio_sp3.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip_studio_sp3.png</h3><img src=\"assets/screenshots-_sip_studio_sp3.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip_studio.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip_studio.png</h3><img src=\"assets/screenshots-_sip_studio.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_sip.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_sip.png</h3><img src=\"assets/screenshots-_sip.png\" style=\"max-width:100%\" /></div><div id=\"assets/screenshots-_terms.png\" class=\"artifact-detail\" hidden><h3>assets/screenshots-_terms.png</h3><img src=\"assets/screenshots-_terms.png\" style=\"max-width:100%\" /></div><div id=\"../../../ux-flow-tester/spec/UX-Flow-Tester-Product-Spec (1).md\" class=\"artifact-detail\" hidden><h3>../../../ux-flow-tester/spec/UX-Flow-Tester-Product-Spec (1).md</h3><div class=\"markdown\"><h2>UX Flow Tester — Product Specification (v1)</h2><p></p><p><strong>Version:</strong> 1.1  </p><p><strong>Status:</strong> Draft  </p><p><strong>Last Updated:</strong> 2026-08-09</p><p></p><p>---</p><p></p><h3>1. Product Vision</h3><p></p><p>UX Flow Tester reverse-engineers a web application to recover its missing interaction specification, then verifies that the live product delivers coherent, complete user flows.</p><p></p><p>It is designed for modern SPAs and AI-generated UIs where formal flow specifications are missing, incomplete, or outdated.</p><p></p><p>The system treats the <strong>navigation graph as a first-class engineering artifact</strong> (Graph Engineering) and uses reflective optimization (GEPA) to continuously improve its own inference and prioritization modules.</p><p></p><p><strong>Long-term vision:</strong> Expand into richer requirement and architecture recovery, continuous monitoring, automated fix suggestions, and self-improving recovery/prioritization via GEPA.  </p><p><strong>v1 focus:</strong> High-quality navigation &amp; interaction recovery + verification, presented in an interactive, human-in-the-loop experience, with foundational support for Graph Engineering and GEPA.</p><p></p><p>---</p><p></p><h3>2. v1 Goal</h3><p></p><p>Given a web application (URL + optional codebase), the system must:</p><p></p><p>1. Recover a usable <strong>Design / Interaction Specification</strong> and <strong>Intended Navigation Graph</strong></p><p>2. Infer core personas and high-value journeys</p><p>3. Intelligently select important input scenarios (avoid combinatorial explosion)</p><p>4. Verify the live application against recovered navigation contracts</p><p>5. Present progress and results in live, interactive graph/tree views</p><p>6. Support optional manual review gates before expensive runs</p><p>7. Clearly surface:</p><p>   - Broken transitions</p><p>   - Missing return paths</p><p>   - Dead-end states</p><p>   - Major gaps in intended flows</p><p>8. Treat the navigation graph as a versioned, inspectable, diffable artifact</p><p>9. Provide the foundation for GEPA-based optimization of recovery and prioritization modules</p><p></p><p>---</p><p></p><h3>3. v1 Scope</h3><p></p><h4>In Scope</h4><p></p><p><strong>A. Reverse Engineering (Focused)</strong></p><li>Recover screens / major states</li><li>Recover interactive elements and apparent transitions</li><li>Build an Intended Navigation Graph as a first-class artifact</li><li>Infer a small set of core personas and critical journeys</li><li>Light requirement signal (main user goals)</li><p></p><p><strong>B. Specification Synthesis</strong></p><li>Turn the recovered interaction model into explicit test contracts</li><li>Prioritize journeys that matter most</li><li>Select only important input value combinations</li><p></p><p><strong>C. Verification</strong></p><li>Execute prioritized paths on the live application (parallel)</li><li>Detect navigational failures (broken transitions, missing returns, dead ends, unreachable intended states)</li><p></p><p><strong>D. Interactive Presentation</strong></p><li>Live graph / tree visualization of flows</li><li>Clickable path explorer (prototype-like)</li><li>Mindmap / hierarchical views</li><li>Markdown rendering of plans and recovered specs</li><p></p><p><strong>E. Human-in-the-Loop</strong></p><li>Optional manual review gates</li><li>Ability to approve, edit, or reject plans before execution</li><p></p><p><strong>F. Graph Engineering Foundations</strong></p><li>Explicit, versionable navigation graph</li><li>Intended vs Actual graph differencing</li><li>Graph algorithms for coverage, return-path detection, and dead-end finding</li><li>Graph as the primary object of both computation and UI</li><p></p><p><strong>G. GEPA Foundations</strong></p><li>Structured feedback from verification runs</li><li>Design of recovery and synthesis modules as optimizable components</li><li>Support for offline reflective improvement of prompts/modules</li><p></p><h4>Out of Scope for v1</h4><li>Full formal Requirement Specification</li><li>Deep Architecture Specification</li><li>Visual design critique</li><li>Accessibility auditing (beyond basic navigation)</li><li>Performance testing</li><li>Automatic code fixes or PR generation</li><li>Native mobile applications</li><li>Fully automated online GEPA loops in production (foundation only)</li><p></p><p>---</p><p></p><h3>4. Core Workflow</h3><p></p><pre class=\"codeblock\"><p>1. Ingest</p><p>   - Application URL (required)</p><p>   - Optional: codebase, existing docs, auth credentials, configuration</p><p></p><p>2. Recover Interaction Model</p><p>   - Crawl + observe live app</p><p>   - Optionally analyze code (routes, navigation)</p><p>   - Produce: screens/states, transitions, Intended Navigation Graph (versioned)</p><p>   - Infer core personas + critical journeys</p><p></p><p>3. Synthesize Contracts &amp; Scenarios</p><p>   - Define must-reach states and required transitions/return paths</p><p>   - Prioritize journeys</p><p>   - Select important input scenarios only</p><p></p><p>4. Optional Review Gate</p><p>   - Present recovered model + planned journeys in Markdown + graph views</p><p>   - User can approve / edit / reject</p><p></p><p>5. Verify</p><p>   - Execute prioritized paths in parallel</p><p>   - Record actual outcomes vs contracts</p><p>   - Stream progress into live graph</p><p>   - Produce rich traces + feedback for potential GEPA use</p><p></p><p>6. Analyze &amp; Diff</p><p>   - Compare Intended vs Actual graphs</p><p>   - Detect broken transitions, missing returns, dead ends</p><p></p><p>7. Report &amp; Explore</p><p>   - Interactive graph with status overlays</p><p>   - Clickable path explorer for interesting/broken flows</p><p>   - Prioritized issue list with evidence</p><pre class=\"codeblock\"><p></p><p>---</p><p></p><h3>5. Functional Requirements</h3><p></p><h4>5.1 Reverse Engineering</h4><p>The system must recover:</p><li>Screens / major UI states (with screenshots and state signatures)</li><li>Interactive elements and observed/inferred transitions</li><li>An Intended Navigation Graph (first-class, versionable)</li><li>A small set of core personas and critical journeys</li><li>Light signals of primary user goals</li><p></p><p>Sources: live application (DOM, screenshots, routing, network) + optional codebase + optional existing docs.</p><p></p><h4>5.2 Input Scenario Control</h4><li>Detect points where user input affects navigation or downstream state</li><li>Avoid exhaustive combinatorial explosion</li><li>Select only high-value input variations using:</li><p>  - Persona/goal importance</p><p>  - Equivalence partitioning &amp; boundaries</p><p>  - Observed impact on reachable states</p><p>  - LLM judgment for minimal high-signal sets</p><li>Explicitly show which scenarios were chosen and why others were deprioritized</li><p></p><h4>5.3 Verification Engine</h4><li>Execute prioritized journeys against the live app</li><li>Support deterministic steps and goal-oriented agent fallback</li><li>Record actual transitions, screenshots, and outcomes</li><li>Detect broken/incorrect transitions, missing return paths, dead ends, and unreachable intended states</li><li>Emit structured traces and natural-language feedback suitable for GEPA-style reflection</li><p></p><h4>5.4 Interactive Presentation</h4><p><strong>Live Graph / Tree View</strong></p><li>Nodes = screens/states</li><li>Edges = user actions</li><li>Visual status encoding (working / broken / untested / missing return)</li><li>Clickable nodes and edges for details</li><li>Filters by persona, priority, issue type</li><li>Support for viewing Intended vs Actual overlays</li><p></p><p><strong>Path Explorer</strong></p><li>Step-by-step interactive view of important journeys</li><li>Screenshots + action taken + expected vs actual</li><li>Feels like a clickable prototype for interesting/broken paths</li><p></p><p><strong>Mindmap / Hierarchical Views</strong></p><li>Personas → goals → journeys</li><li>Product areas → flows</li><li>Easy navigation between high-level structure and detail</li><p></p><p><strong>Markdown Viewer</strong></p><li>Clean rendering of recovered specs and planned journeys</li><li>Support for links into graph nodes/paths</li><li>Readable structured documents for review gates</li><p></p><h4>5.5 Manual Review Gates (Optional)</h4><p>Users can insert approval steps:</p><li>After reverse engineering (review recovered Interaction Spec + Graph)</li><li>After prioritization (approve/edit planned journeys and input scenarios)</li><li>Before large verification runs</li><p></p><p>Actions: Approve / Edit / Reject &amp; regenerate with guidance.</p><p></p><h4>5.6 Graph Engineering Requirements</h4><li>The navigation graph is a first-class artifact: versioned, inspectable, diffable, and the primary object of both reasoning and UI.</li><li>Explicit distinction between Intended Graph and Actual Graph.</li><li>Graph algorithms used for:</li><p>  - Return-path detection</p><p>  - Dead-end identification</p><p>  - Coverage measurement</p><p>  - Path prioritization support</p><li>Graph diffs form a core part of the verification report.</li><p></p><h4>5.7 GEPA Foundations</h4><li>Recovery and Synthesis modules are designed as optimizable components with clear inputs/outputs.</li><li>Verification runs produce rich traces + diagnostic feedback (not only scalar scores).</li><li>The system supports offline GEPA-style reflective optimization of key prompts/modules against a small set of labeled or synthetic apps.</li><li>Metrics and feedback functions are defined so that improvements in recovery quality and prioritization quality can be measured and optimized.</li><p></p><p>---</p><p></p><h3>6. Non-Functional Requirements</h3><p></p><li>Works on modern SPAs (client-side routing, dynamic content)</li><li>Supports authenticated areas (credentials / test accounts)</li><li>Runnable locally and in CI</li><li>Parallel path execution</li><li>Transparent inference (user can inspect why something was inferred or flagged)</li><li>Graceful handling of incomplete recovered models</li><li>Real-time or near-real-time updates to the graph during execution</li><li>Graph artifacts are durable and queryable across runs</li><p></p><p>---</p><p></p><h3>7. Inputs</h3><p></p>| Input                        | Required | Purpose                                      ||-----------------------------|----------|----------------------------------------------|| Application URL             | Yes      | Primary source for recovery and verification || Codebase                    | Optional | Improves recovery of structure and transitions || Existing docs / personas    | Optional | Seeds or corrects recovered model            || Auth credentials            | Optional | Access protected areas                       || Configuration               | Optional | Depth, parallelism, focus areas, review gates |<p></p><p>---</p><p></p><h3>8. Outputs</h3><p></p><p>1. Recovered Design / Interaction Specification</p><p>2. Versioned Intended Navigation Graph</p><p>3. Actual Navigation Graph (from execution)</p><p>4. Graph diff (Intended vs Actual)</p><p>5. Inferred personas + prioritized journeys</p><p>6. Selected input scenarios (with rationale)</p><p>7. Live interactive graph and path explorer</p><p>8. Verification Report (issues + evidence)</p><p>9. Structured traces/feedback suitable for GEPA</p><p>10. Optional: generated Playwright tests for critical paths</p><p></p><p>---</p><p></p><h3>9. Success Criteria (v1)</h3><p></p><p>The product succeeds when it can, with minimal configuration:</p><p></p><li>Reconstruct a useful Intended Navigation Graph from a real SPA</li><li>Identify non-obvious flow problems (especially missing return paths and dead ends)</li><li>Keep input scenario combinations limited and justified</li><li>Let users explore flows interactively in graph/tree views</li><li>Support lightweight optional review gates</li><li>Treat the graph as a first-class, diffable artifact</li><li>Produce rich enough traces/feedback to support future GEPA optimization</li><li>Produce reports and interactive views that teams find immediately actionable</li><li>Require significantly less manual effort than writing equivalent end-to-end flow tests</li><p></p><p>---</p><p></p><h3>10. Design Principles</h3><p></p><li>Prefer high-signal navigation issues over exhaustive coverage</li><li>Recovered models and plans must be inspectable and editable</li><li>Runtime grounding (real browser execution) is mandatory</li><li>Prioritization over brute-force exploration</li><li>Interactive exploration over static reports</li><li>Human-in-the-loop should feel lightweight, not bureaucratic</li><li>Transparent reasoning</li><li><strong>Graph as first-class artifact</strong> (Graph Engineering)</li><li><strong>Modules are optimizable via reflection on full traces</strong> (GEPA-ready)</li><p></p><p>---</p><p></p><h3>11. Future Expansion (Post-v1)</h3><p></p><li>Richer Requirement recovery</li><li>Deeper Architecture analysis</li><li>Continuous / CI monitoring mode</li><li>Auto-generation of Playwright tests and suggested fixes</li><li>Multi-role and feature-flag aware exploration</li><li>Stronger collaborative review features</li><li>Online or periodic GEPA optimization loops on real customer apps</li><li>Advanced graph algorithms and embeddings for large applications</li><p></p><p>---</p><p></p><h3>12. Positioning</h3><p></p><p>UX Flow Tester is a <strong>specification recovery + navigational verification system</strong> built on Graph Engineering principles, with an interactive human-in-the-loop interface and a foundation for reflective self-improvement (GEPA).</p><p></p><p>It first reconstructs what the product’s flows appear to be (as an explicit graph), lets the user review and refine that understanding, verifies whether the live experience delivers coherent user journeys, and is designed so that its own inference quality can improve over time through reflective optimization.</p><p></p></div></div><div id=\"../../../ux-flow-tester/spec/UX-Flow-Tester-Technical-Spec (1).md\" class=\"artifact-detail\" hidden><h3>../../../ux-flow-tester/spec/UX-Flow-Tester-Technical-Spec (1).md</h3><div class=\"markdown\"><h2>UX Flow Tester — Technical Specification (v1)</h2><p></p><p><strong>Version:</strong> 1.1  </p><p><strong>Status:</strong> Draft  </p><p><strong>Last Updated:</strong> 2026-08-09  </p><p><strong>Companion:</strong> UX-Flow-Tester-Product-Spec.md</p><p></p><p>---</p><p></p><h3>1. Overview</h3><p></p><p>This document defines the technical architecture, data models, pipeline stages, and key interfaces for UX Flow Tester v1.</p><p></p><p>The system reverse-engineers a web application’s interaction model, synthesizes prioritized navigation contracts (with controlled input scenarios), optionally pauses for human review, executes verification in parallel, and presents results in interactive graph/tree views.</p><p></p><p>It is built on two reinforcing ideas:</p><p></p><li><strong>Graph Engineering</strong>: The navigation graph is a first-class, versioned, diffable artifact that both the system and the user reason over.</li><li><strong>GEPA readiness</strong>: Recovery and Synthesis modules are designed as optimizable components that emit rich traces and diagnostic feedback, enabling reflective prompt/system optimization.</li><p></p><p>---</p><p></p><h3>2. High-Level Architecture</h3><p></p><pre class=\"codeblock\"><p>┌─────────────────────────────────────────────────────────────┐</p><p>│                        UI Layer                             │</p><p>│  Graph Viewer · Path Explorer · Mindmap · Markdown Reviewer │</p><p>│  (Intended vs Actual overlays, version diffs)               │</p><p>└────────────────────────────┬────────────────────────────────┘</p><p>                             │</p><p>┌────────────────────────────▼────────────────────────────────┐</p><p>│                     Orchestrator / API                      │</p><p>│   Pipeline control · Review gates · State machine · GEPA hooks│</p><p>└──────┬──────────┬──────────┬──────────┬──────────┬──────────┘</p><p>       │          │          │          │          │</p><p>       ▼          ▼          ▼          ▼          ▼</p><p>  Recovery   Synthesis  Execution   Analysis   Graph Store</p><p>  Engine     Engine     Engine      Engine     (versioned)</p><pre class=\"codeblock\"><p></p><h4>Major Components</h4><p></p>| Component            | Responsibility                                                                 ||----------------------|---------------------------------------------------------------------------------|| Recovery Engine      | Crawl live app + optional code analysis → Interaction Model + Intended Graph   || Synthesis Engine     | Personas, journeys, contracts, input scenario selection                        || Execution Engine     | Parallel Playwright (or agent) path runners; emit rich traces                  || Analysis Engine      | Intended vs Actual graph diff; detect issues; produce GEPA-ready feedback      || Graph Store          | Versioned nodes, edges, paths, evidence, status; diff support                  || Presentation Layer   | Interactive graph, path explorer, mindmap, markdown viewer                     || Orchestrator         | Pipeline state machine + optional review gates + GEPA optimization hooks       |<p></p><p>---</p><p></p><h3>3. Core Data Models</h3><p></p><pre class=\"codeblock\"><p>// ----- Identity &amp; State -----</p><p></p><p>interface Node {</p><p>  id: string;</p><p>  url: string;</p><p>  title?: string;</p><p>  stateSignature: string;          // stable hash of meaningful DOM + key data</p><p>  screenshotPath?: string;</p><p>  isTerminal?: boolean;</p><p>  source: &quot;observed&quot; | &quot;inferred&quot; | &quot;code&quot;;</p><p>  metadata?: Record&lt;string, any&gt;;</p><p>}</p><p></p><p>interface Edge {</p><p>  id: string;</p><p>  from: string;                    // Node.id</p><p>  to: string | null;               // null = broken / no navigation observed</p><p>  action: string;                  // human-readable: &quot;Click &#39;Checkout&#39;&quot;</p><p>  selector?: string;</p><p>  inputScenarioId?: string;</p><p>  isReturnPath: boolean;</p><p>  status: &quot;working&quot; | &quot;broken&quot; | &quot;untested&quot; | &quot;unreachable&quot; | &quot;missing&quot;;</p><p>  error?: string;</p><p>  screenshotPath?: string;</p><p>  evidence?: Evidence[];</p><p>}</p><p></p><p>interface Evidence {</p><p>  type: &quot;screenshot&quot; | &quot;dom&quot; | &quot;network&quot; | &quot;console&quot; | &quot;log&quot;;</p><p>  pathOrValue: string;</p><p>  timestamp: string;</p><p>}</p><p></p><p>// ----- Personas &amp; Journeys -----</p><p></p><p>interface Persona {</p><p>  id: string;</p><p>  name: string;</p><p>  description: string;</p><p>  goals: string[];</p><p>  traits?: string[];</p><p>  source: &quot;inferred&quot; | &quot;provided&quot; | &quot;refined&quot;;</p><p>}</p><p></p><p>interface InputScenario {</p><p>  id: string;</p><p>  description: string;</p><p>  values: Record&lt;string, string | number | boolean&gt;;</p><p>  rationale: string;</p><p>  priority: &quot;critical&quot; | &quot;high&quot; | &quot;medium&quot; | &quot;low&quot;;</p><p>}</p><p></p><p>interface PrioritizedPath {</p><p>  id: string;</p><p>  personaId: string;</p><p>  goal: string;</p><p>  steps: PathStep[];</p><p>  inputScenarioIds?: string[];</p><p>  priority: &quot;critical&quot; | &quot;high&quot; | &quot;medium&quot; | &quot;low&quot;;</p><p>  reason: string;</p><p>  status: &quot;planned&quot; | &quot;approved&quot; | &quot;running&quot; | &quot;passed&quot; | &quot;failed&quot; | &quot;skipped&quot;;</p><p>}</p><p></p><p>interface PathStep {</p><p>  action: string;</p><p>  expectedNodeId?: string;</p><p>  actualNodeId?: string;</p><p>  status?: &quot;pending&quot; | &quot;passed&quot; | &quot;failed&quot;;</p><p>  evidence?: Evidence[];</p><p>}</p><p></p><p>// ----- Graph Engineering Artifacts -----</p><p></p><p>interface GraphVersion {</p><p>  id: string;</p><p>  type: &quot;intended&quot; | &quot;actual&quot; | &quot;merged&quot;;</p><p>  createdAt: string;</p><p>  parentVersionId?: string;</p><p>  nodes: Record&lt;string, Node&gt;;</p><p>  edges: Edge[];</p><p>  entryPoints: string[];</p><p>  metadata?: Record&lt;string, any&gt;;</p><p>}</p><p></p><p>interface GraphDiff {</p><p>  fromVersionId: string;</p><p>  toVersionId: string;</p><p>  addedNodes: string[];</p><p>  removedNodes: string[];</p><p>  addedEdges: string[];</p><p>  removedEdges: string[];</p><p>  changedEdges: string[];          // status or target changed</p><p>  missingReturnPaths: string[];    // node or edge ids</p><p>  deadEnds: string[];</p><p>}</p><p></p><p>// ----- Top-level Artifacts -----</p><p></p><p>interface InteractionModel {</p><p>  intendedGraph: GraphVersion;</p><p>  actualGraph?: GraphVersion;</p><p>  diff?: GraphDiff;</p><p>  recoveredAt: string;</p><p>  sources: (&quot;live&quot; | &quot;code&quot; | &quot;docs&quot;)[];</p><p>}</p><p></p><p>interface VerificationReport {</p><p>  summary: {</p><p>    nodesCovered: number;</p><p>    edgesCovered: number;</p><p>    brokenTransitions: number;</p><p>    missingReturnPaths: number;</p><p>    deadEnds: number;</p><p>  };</p><p>  issues: Issue[];</p><p>  graphDiff?: GraphDiff;</p><p>  generatedAt: string;</p><p>}</p><p></p><p>interface Issue {</p><p>  id: string;</p><p>  type: &quot;broken_transition&quot; | &quot;missing_return&quot; | &quot;dead_end&quot; | &quot;unreachable&quot; | &quot;spec_deviation&quot;;</p><p>  severity: &quot;critical&quot; | &quot;high&quot; | &quot;medium&quot; | &quot;low&quot;;</p><p>  title: string;</p><p>  description: string;</p><p>  nodeIds?: string[];</p><p>  edgeIds?: string[];</p><p>  pathId?: string;</p><p>  evidence?: Evidence[];</p><p>}</p><p></p><p>// ----- GEPA Support -----</p><p></p><p>interface TraceFeedback {</p><p>  runId: string;</p><p>  module: &quot;recovery&quot; | &quot;synthesis&quot; | &quot;prioritization&quot; | &quot;diagnosis&quot;;</p><p>  score: number;                   // scalar for ranking</p><p>  feedback: string;                // rich natural-language diagnosis</p><p>  traceSummary: string;            // key steps / observations</p><p>  examples?: any[];                // supporting evidence</p><p>}</p><pre class=\"codeblock\"><p></p><p>---</p><p></p><h3>4. Pipeline Stages</h3><p></p><h4>Stage 1 — Ingest</h4><li>Accept URL (required), optional codebase path, docs, credentials, config.</li><li>Normalize configuration (max depth, parallel workers, review gates on/off, focus areas).</li><p></p><h4>Stage 2 — Recovery</h4><p><strong>Live recovery</strong></p><li>Playwright-based crawler (BFS or guided).</li><li>For each state: capture URL, title, screenshot, state signature, interactive elements.</li><li>Record observed transitions.</li><li>Handle basic auth and simple session setup.</li><p></p><p><strong>Code recovery (optional)</strong></p><li>Parse routes (Next.js, React Router, etc.).</li><li>Extract navigation calls and major page components.</li><li>Merge with live observations.</li><p></p><p><strong>Output:</strong> Versioned <code>Intended Graph</code> + initial <code>InteractionModel</code></p><p></p><h4>Stage 3 — Synthesis</h4><li>Infer or refine 3–7 core personas.</li><li>Generate prioritized journeys per persona.</li><li>Detect input-sensitive points and select a minimal high-value set of <code>InputScenario</code>s.</li><li>Produce explicit navigation contracts.</li><li>Attach rationale to every prioritized path and input scenario.</li><p></p><p><strong>Output:</strong> Personas, <code>PrioritizedPath[]</code>, <code>InputScenario[]</code>, contracts</p><p></p><h4>Stage 4 — Optional Review Gate</h4><li>Persist current plan as Markdown + graph snapshot.</li><li>Expose UI for user to inspect, edit, approve, or reject.</li><li>On reject: accept free-text guidance and re-run synthesis (or parts of it).</li><li>State machine: <code>draft → under_review → approved → executing</code></li><p></p><h4>Stage 5 — Execution</h4><li>Parallel workers (configurable).</li><li>Each worker executes one <code>PrioritizedPath</code> sequentially.</li><li>On every step: perform action, capture state + screenshot, record actual edge, update graph store live.</li><li>Emit structured traces suitable for later reflection.</li><p></p><h4>Stage 6 — Analysis (Graph Engineering core)</h4><li>Build or update the <strong>Actual Graph</strong>.</li><li>Compute <strong>GraphDiff</strong> (Intended vs Actual).</li><li>Detect:</li><p>  - Broken transitions</p><p>  - Missing return paths (graph algorithm)</p><p>  - Dead-end nodes</p><p>  - Unreachable intended nodes</p><li>Generate <code>Issue[]</code> with severity and evidence.</li><li>Produce <code>TraceFeedback</code> objects for GEPA.</li><p></p><h4>Stage 7 — Presentation</h4><li>Stream updates to the interactive graph during execution.</li><li>Final views:</li><p>  - Full navigation graph with status and Intended/Actual overlays</p><p>  - Graph diff visualization</p><p>  - Filterable issue list</p><p>  - Path explorer</p><p>  - Mindmap of personas → goals → journeys</p><p>  - Markdown report export</p><p></p><p>---</p><p></p><h3>5. Graph Engineering Layer</h3><p></p><h4>5.1 Principles</h4><li>The navigation graph is the primary artifact of both computation and user interaction.</li><li>Intended and Actual graphs are first-class and versioned.</li><li>Diffs are explicit and queryable.</li><li>Classical graph algorithms are used for structural properties (returns, dead ends, coverage).</li><p></p><h4>5.2 Key Operations</h4><li><code>createVersion(type, nodes, edges)</code> → GraphVersion</li><li><code>diff(intended, actual)</code> → GraphDiff</li><li><code>findMissingReturnPaths(graph)</code> → list of nodes/edges</li><li><code>findDeadEnds(graph)</code> → list of nodes</li><li><code>computeCoverage(intended, actual)</code> → metrics</li><li><code>highlightPath(graph, pathId)</code> for UI</li><p></p><h4>5.3 UI Implications</h4><li>Graph Viewer must support version selection and overlay (Intended vs Actual).</li><li>Diffs should be visually scannable (added/removed/changed edges and nodes).</li><li>Users can click from an issue directly into the relevant graph region.</li><p></p><p>---</p><p></p><h3>6. GEPA Integration (Foundations)</h3><p></p><h4>6.1 Design Goals</h4><li>Recovery and Synthesis are written as clear modules with typed inputs/outputs.</li><li>Every verification run can emit <code>TraceFeedback</code> containing:</li><p>  - Scalar score (for ranking)</p><p>  - Natural-language diagnosis of what went wrong or right</p><p>  - Compact trace summary</p><li>Offline GEPA loops can optimize the prompts/instructions of these modules against a small training set of apps or synthetic cases.</li><p></p><h4>6.2 Example Feedback Targets</h4><li>Recovery quality: “Did the recovered graph capture the known critical screens and transitions?”</li><li>Prioritization quality: “Did the selected journeys include the known broken flows while staying within budget?”</li><li>Diagnosis quality: “Are missing return paths and dead ends correctly identified and explained?”</li><p></p><h4>6.3 Future Online Use</h4><p>Post-v1, the same feedback channel can support periodic or continuous reflective improvement on real customer workloads (with appropriate privacy and control).</p><p></p><p>---</p><p></p><h3>7. Presentation Layer Requirements</h3><p></p><h4>7.1 Graph Viewer</h4><li>Technology suggestion: Cytoscape.js, React Flow, or equivalent.</li><li>Features:</li><p>  - Zoom, pan, search</p><p>  - Click node/edge → details + evidence</p><p>  - Color / stroke encoding for status and priority</p><p>  - Intended vs Actual overlay or side-by-side</p><p>  - Version switching and diff highlighting</p><p>  - Live updates while execution is running</p><p>  - Filter by persona, priority, status, issue type</p><p></p><h4>7.2 Path Explorer</h4><li>Sequential, prototype-like view.</li><li>Screenshot + action + expected vs actual per step.</li><li>Jump links into the graph.</li><p></p><h4>7.3 Mindmap / Hierarchical View</h4><li>Personas → goals → journeys → key screens.</li><p></p><h4>7.4 Markdown Viewer</h4><li>Render recovered specs, planned journeys, and reports.</li><li>Internal links to graph nodes/paths.</li><li>Clean typography for review sessions.</li><p></p><p>---</p><p></p><h3>8. Input Scenario Control (Technical)</h3><p></p><p>1. Identify forms/controls that influence navigation or major state.</p><p>2. Propose candidate partitions (empty, valid typical, invalid, boundary, persona-relevant).</p><p>3. Score combinations by impact, persona relevance, and likelihood of exposing issues.</p><p>4. Keep only a budgeted set per journey.</p><p>5. Store and surface rationale.</p><p>6. Feed selection quality into GEPA feedback when optimizing the synthesis module.</p><p></p><p>---</p><p></p><h3>9. Review Gate State Machine</h3><p></p><pre class=\"codeblock\"><p>draft</p><p>  → under_review</p><p>      → approved</p><p>      → rejected          (feedback → synthesis or draft)</p><p>approved</p><p>  → executing</p><p>      → completed</p><p>      → failed</p><pre class=\"codeblock\"><p></p><p>---</p><p></p><h3>10. Suggested Technology Stack (v1)</h3><p></p>| Layer              | Suggestion                                      ||--------------------|-------------------------------------------------|| Runtime            | Node.js + TypeScript                            || Browser automation | Playwright                                      || Optional agents    | Playwright Test Agents / browser-use / Midscene || LLM                | Claude / OpenAI / local (via abstraction)       || Optimization       | DSPy + GEPA (for offline module improvement)    || Graph storage      | SQLite or JSON + in-memory; versioned artifacts || Graph visualization| Cytoscape.js or React Flow                      || UI                 | React / Next.js                                 || Markdown           | MDX or standard markdown renderer               || API                | Simple REST or tRPC                             || Parallelism        | Playwright workers or job queue                 |<p></p><p>---</p><p></p><h3>11. Key Interfaces (Sketch)</h3><p></p><pre class=\"codeblock\"><p>interface RecoveryEngine {</p><p>  recover(options: RecoveryOptions): Promise&lt;InteractionModel&gt;;</p><p>}</p><p></p><p>interface SynthesisEngine {</p><p>  synthesize(model: InteractionModel, options: SynthesisOptions): Promise&lt;{</p><p>    personas: Persona[];</p><p>    paths: PrioritizedPath[];</p><p>    scenarios: InputScenario[];</p><p>    contracts: Contract[];</p><p>  }&gt;;</p><p>}</p><p></p><p>interface ExecutionEngine {</p><p>  execute(paths: PrioritizedPath[], options: ExecutionOptions): AsyncIterable&lt;ExecutionEvent&gt;;</p><p>}</p><p></p><p>interface AnalysisEngine {</p><p>  analyze(intended: GraphVersion, actual: GraphVersion, results: ExecutionResult[]): {</p><p>    report: VerificationReport;</p><p>    feedback: TraceFeedback[];</p><p>  };</p><p>}</p><p></p><p>interface GraphStore {</p><p>  saveVersion(graph: GraphVersion): string;</p><p>  getVersion(id: string): GraphVersion;</p><p>  diff(a: string, b: string): GraphDiff;</p><p>  // live query helpers for the UI</p><p>}</p><pre class=\"codeblock\"><p></p><p>---</p><p></p><h3>12. Configuration (Example)</h3><p></p><pre class=\"codeblock\"><p>url: https://staging.example.com</p><p>codebase: ./apps/web</p><p>auth:</p><p>  strategy: storage_state</p><p>  storageStatePath: ./auth.json</p><p>limits:</p><p>  maxNodes: 150</p><p>  maxDepth: 6</p><p>  parallelWorkers: 6</p><p>  maxInputScenariosPerPath: 4</p><p>reviewGates:</p><p>  afterRecovery: true</p><p>  afterSynthesis: true</p><p>graph:</p><p>  versioning: true</p><p>  retainVersions: 20</p><p>gepa:</p><p>  enabled: false          # offline optimization only in v1</p><p>  feedbackCapture: true</p><p>llm:</p><p>  provider: anthropic</p><p>  model: claude-sonnet-5</p><pre class=\"codeblock\"><p></p><p>---</p><p></p><h3>13. Implementation Order (Recommended)</h3><p></p><p>1. Project setup + core data models + versioned Graph Store</p><p>2. Basic Playwright crawler (Recovery Engine – live only)</p><p>3. Simple Synthesis (personas + paths) with LLM</p><p>4. Single-path executor + parallel wrapper</p><p>5. Analysis with GraphDiff + missing-return / dead-end detection</p><p>6. Graph visualization (static → live updates + Intended/Actual)</p><p>7. Path Explorer + Markdown report</p><p>8. Input scenario selection logic</p><p>9. Review gate state machine + UI</p><p>10. TraceFeedback emission (GEPA foundation)</p><p>11. Code-assisted recovery</p><p>12. Offline GEPA experimentation harness</p><p>13. Polish, CI mode, export</p><p></p><p>---</p><p></p><h3>14. Open Technical Risks &amp; Mitigations</h3><p></p>| Risk                              | Mitigation                                              ||-----------------------------------|---------------------------------------------------------|| Low-quality recovered model       | Inspectable/editable graph; user correction; GEPA later || Combinatorial input explosion     | Strict budgeting + rationale + GEPA on selection logic  || Flaky live execution              | Retries, stable state signatures, clear evidence        || Auth & stateful areas             | Explicit auth setup + storage state support             || LLM non-determinism in planning   | Structured outputs, review gates, later GEPA            || Graph UI performance              | Clustering / pagination for large graphs                || Version explosion                 | Retention policy + prune old versions                   |<p></p><p>---</p><p></p><h3>15. Success Metrics (Technical)</h3><p></p><li>Can recover a usable navigation graph from a real SPA with reasonable compute</li><li>Input scenarios per critical path stay within budget</li><li>Review gates remain lightweight</li><li>Interactive graph remains responsive for typical app sizes</li><li>Clear evidence attached to every reported issue</li><li>GraphDiff correctly surfaces missing returns and dead ends</li><li>TraceFeedback is sufficiently diagnostic for offline GEPA experiments</li><p></p><p>---</p><p></p><p>This technical specification is implementation-ready and explicitly incorporates Graph Engineering and GEPA foundations.</p><p></p></div></div></div></div>";

const nodeIds = Object.keys(GRAPH.nodes).sort();
const unreachable = new Set(ANALYSIS.unreachableNodes);
const deadEnd = new Set(ANALYSIS.deadEndNodes);
let view = "graph";
let selectedNode = nodeIds.find((id) => GRAPH.entryPoints.includes(id)) || nodeIds[0];

function nodeStatusClass(id) {
  if (unreachable.has(id)) return "bad";
  if (deadEnd.has(id)) return "warn";
  return "ok";
}

function edgesFrom(id) { return GRAPH.edges.filter((e) => e.from === id); }
function edgesTo(id) { return GRAPH.edges.filter((e) => e.to === id); }

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = '<input type="text" id="filter" placeholder="Filter screens...">' +
    '<div id="node-list"></div>';
  document.getElementById("filter").addEventListener("input", (e) => renderNodeList(e.target.value));
  renderNodeList("");
}

function renderNodeList(filter) {
  const list = document.getElementById("node-list");
  const filtered = nodeIds.filter((id) => id.toLowerCase().includes(filter.toLowerCase()));
  list.innerHTML = filtered.map((id) =>
    '<div class="node-item' + (id === selectedNode ? ' selected' : '') + '" data-node="' + escapeHtml(id) + '">' +
    '<span class="dot ' + nodeStatusClass(id) + '"></span><span>' + escapeHtml(id) + '</span></div>'
  ).join("");
  list.querySelectorAll(".node-item").forEach((el) => el.addEventListener("click", () => {
    selectedNode = el.dataset.node;
    renderNodeList(filter);
    renderMain();
  }));
}

function edgeRow(e, showTo) {
  const target = showTo ? e.to : e.from;
  return '<tr><td>' + escapeHtml(e.action) + '</td><td>' + (target ? '<code>' + escapeHtml(target) + '</code>' : '<span class="muted">unresolved</span>') +
    '</td><td><span class="badge ' + e.status + '">' + e.status + '</span></td><td class="muted">' + escapeHtml(e.error || "") + '</td></tr>';
}

function renderGraphView() {
  const node = GRAPH.nodes[selectedNode];
  if (!node) return '<p class="muted">No screen selected.</p>';
  const out = edgesFrom(selectedNode), incoming = edgesTo(selectedNode);
  let html = '<h2>' + escapeHtml(selectedNode) + '</h2>';
  html += '<p class="muted">' + escapeHtml(node.title || "") + ' &middot; source: ' + escapeHtml(node.source) +
    (node.sourceFile ? ' &middot; <code>' + escapeHtml(node.sourceFile) + '</code>' : '') + '</p>';
  if (node.metadata && node.metadata.forms && node.metadata.forms.length) {
    html += '<p class="muted">Forms detected: ' + node.metadata.forms.map((f) => f.fields.length + ' field(s)').join(", ") + '</p>';
  }
  html += '<h2>Outgoing (' + out.length + ')</h2>';
  html += out.length
    ? '<table><tr><th>Action</th><th>To</th><th>Status</th><th>Error</th></tr>' + out.map((e) => edgeRow(e, true)).join("") + '</table>'
    : '<p class="muted">None.</p>';
  html += '<h2>Incoming (' + incoming.length + ')</h2>';
  html += incoming.length
    ? '<table><tr><th>Action</th><th>From</th><th>Status</th><th>Error</th></tr>' + incoming.map((e) => edgeRow(e, false)).join("") + '</table>'
    : '<p class="muted">None - nothing links here.</p>';
  return html;
}

function resultFor(pathId) { return RESULTS.find((r) => r.pathId === pathId); }

function renderPathsView() {
  if (!PATHS.length) return '<p class="muted">No prioritized paths loaded - pass --paths when running explore.</p>';
  return PATHS.map((p) => {
    const result = resultFor(p.id);
    const stepsHtml = p.steps.map((s, i) =>
      '<div class="step">' + (i + 1) + '. ' + escapeHtml(s.action) +
      (s.status ? ' <span class="badge ' + s.status + '">' + s.status + '</span>' : '') +
      (s.error ? ' <span class="muted">' + escapeHtml(s.error) + '</span>' : '') + '</div>'
    ).join("");
    return '<h2>' + escapeHtml(p.goal) + ' <span class="badge ' + (result ? result.status : p.status) + '">' +
      (result ? result.status : p.status) + '</span> <span class="badge ' + p.priority + '" style="background:#374151">' + p.priority + '</span></h2>' +
      '<p class="muted">' + escapeHtml(p.reason) + '</p>' + stepsHtml;
  }).join("");
}

function listSection(title, items, render) {
  if (!items.length) return '<h2>' + title + ' (0)</h2><p class="muted">None.</p>';
  return '<h2>' + title + ' (' + items.length + ')</h2><table>' + items.map(render).join("") + '</table>';
}

function renderProjectsView() {
  if (!PROJECT.length) return '<p class="muted">No project artifacts passed with --project.</p>';
  return PROJECTS_HTML;
}

function renderIssuesView() {
  let html = "";
  html += listSection("Unreachable screens", ANALYSIS.unreachableNodes, (id) => '<tr><td><code>' + escapeHtml(id) + '</code></td></tr>');
  html += listSection("Dead-end screens", ANALYSIS.deadEndNodes, (id) => '<tr><td><code>' + escapeHtml(id) + '</code></td></tr>');
  html += listSection("Missing return paths", ANALYSIS.missingReturnPaths, (m) =>
    '<tr><td><code>' + escapeHtml(m.from) + '</code> &rarr; <code>' + escapeHtml(m.to) + '</code></td></tr>');
  html += listSection("Broken edges", ANALYSIS.brokenEdges, (e) =>
    '<tr><td>' + escapeHtml(e.action) + '</td><td class="muted">' + escapeHtml(e.error || "") + '</td></tr>');
  html += listSection("Dead static elements", ANALYSIS.deadStaticElements, (e) =>
    '<tr><td>' + escapeHtml(e.action) + '</td><td class="muted"><code>' + escapeHtml(e.sourceFile || "") + ':' + (e.sourceLine ?? "") + '</code></td></tr>');
  return html;
}

function renderMain() {
  const main = document.getElementById("main");
  if (view === "summary") main.innerHTML = renderSummaryView();
  else if (view === "graph") main.innerHTML = renderGraphView();
  else if (view === "paths") main.innerHTML = renderPathsView();
  else if (view === "projects") main.innerHTML = renderProjectsView();
  else main.innerHTML = renderIssuesView();
}

function summaryFinding(title, count, plain, detail) {
  if (!count) return "";
  return '<div class="finding"><h3>' + title + ' (' + count + ')</h3><div class="muted">' + plain + '</div>' +
    (detail ? '<details><summary>Technical detail</summary>' + detail + '</details>' : '') + '</div>';
}

function renderSummaryView() {
  const nNodes = nodeIds.length;
  const findings = [];
  findings.push(summaryFinding("Dead buttons & links", ANALYSIS.deadStaticElements.length,
    "These look like buttons but do nothing when people click them. They have no click handler, no link, and no form action.",
    ANALYSIS.deadStaticElements.map((e) => '<p>' + escapeHtml(e.action) + ' - <code>' + escapeHtml(e.sourceFile || "") + ':' + escapeHtml(String(e.sourceLine ?? "")) + '</code></p>').join("")));
  findings.push(summaryFinding("Transitions that fail", ANALYSIS.brokenEdges.length,
    "A click that should take someone to another screen but doesn't. Either the page stays put or the action errors out.",
    ANALYSIS.brokenEdges.map((e) => '<p>click "' + escapeHtml(e.action) + '" on ' + escapeHtml(e.from) + ' -> ' + escapeHtml(e.to || "unresolved") +
      (e.error ? '<br><code>' + escapeHtml(e.error) + '</code>' : '') + '</p>').join("")));
  findings.push(summaryFinding("Screens nothing links to", ANALYSIS.unreachableNodes.length,
    "These screens exist in the app, but no button or link anywhere in the app connects to them. Users could only reach them by typing the URL.",
    ANALYSIS.unreachableNodes.map((id) => '<p><code>' + escapeHtml(id) + '</code></p>').join("")));
  findings.push(summaryFinding("Dead-end screens", ANALYSIS.deadEndNodes.length,
    "You can get here, but there is no button or link that takes you anywhere else. A trap for users.",
    ANALYSIS.deadEndNodes.map((id) => '<p><code>' + escapeHtml(id) + '</code></p>').join("")));
  findings.push(summaryFinding("Missing return paths", ANALYSIS.missingReturnPaths.length,
    "Ways to get here, but no way back out again - a user reaches them and their only option is the back button.",
    ANALYSIS.missingReturnPaths.map((m) => '<p><code>' + escapeHtml(m.from) + '</code> to <code>' + escapeHtml(m.to) + '</code></p>').join("")));
  findings.push(summaryFinding("Local-state-only buttons", ANALYSIS.localStateOnlyElements.length,
    "These only change the page you're on (opening dialogs, filtering lists) and never save anything. Some are intentional; some may be missing their 'save' step.",
    ANALYSIS.localStateOnlyElements.map((e) => '<p>' + escapeHtml(e.action) + ' - <code>' + escapeHtml(e.sourceFile || "") + ':' + (e.sourceLine ?? "") + '</code></p>').join("")));

  var problemCount = ANALYSIS.deadStaticElements.length + ANALYSIS.brokenEdges.length + ANALYSIS.unreachableNodes.length;
  var healthCls = problemCount === 0 ? "verdict-ok" : "verdict-warn";
  var healthWord = problemCount === 0 ? "Looking good, no problems found." : "Has issues worth a look (" + problemCount + " finding(s)).";

  var html = '<h2>Overall</h2>';
  html += '<div class="health"><div class="big ' + healthCls + '">' + nNodes + ' screens</div>';
  html += '<div class="healthline ' + healthCls + '">' + healthWord + '</div>';
  if (PATHS.length) {
    var passed = RESULTS.filter(function(r){ return r.status === "passed"; }).length;
    html += '<div class="healthline">Prioritized journeys executed: ' + passed + '/' + RESULTS.length + ' passed. <a href="#" onclick="switchView(&apos;paths&apos;); return false;">See journeys</a></div>';
  }
  html += '</div>';
  html += '<h2>What we found</h2>' + findings.join("") +
    '<details><summary>Raw analysis (advanced)</summary><div class="muted">This is the raw data the report is built from.</div><pre>' + escapeHtml(JSON.stringify(ANALYSIS, null, 2)) + '</pre></details>';
  return html;
}

function switchView(name) {
  view = name;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
  renderMain();
}

document.querySelectorAll("nav button").forEach((btn) => btn.addEventListener("click", () => switchView(btn.dataset.view)));

// Projects tab: "open" buttons reveal their pre-rendered detail block.
document.addEventListener("click", (ev) => {
  const target = ev.target.closest(".artifact-open");
  if (!target) return;
  const id = target.dataset.id;
  const all = document.querySelectorAll(".artifact-detail");
  all.forEach((d) => { d.hidden = true; });
  const detail = document.querySelector('.artifact-detail[id="' + CSS.escape(id) + '"]');
  if (detail) detail.hidden = false;
});

renderSidebar();
renderMain();
</script>
</body>
</html>
