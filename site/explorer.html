:root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --border:#ddd; --panel:#f7f7f8; --accent:#2563eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111214; --fg:#eee; --muted:#999; --border:#333; --panel:#1a1b1e; --accent:#60a5fa; }
}
* { box-sizing: border-box; }
body { margin:0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; background:var(--bg); color:var(--fg); }
header { padding: 12px 16px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:16px; }
header h1 { font-size: 15px; margin: 0; }
nav button { background:none; border:1px solid var(--border); color:var(--fg); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.layout { display:flex; height: calc(100vh - 49px); }
.sidebar { width: 300px; border-right:1px solid var(--border); overflow-y:auto; }
.sidebar input { width: calc(100% - 20px); margin:8px 10px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--fg); }
.node-item { padding:7px 12px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--border); }
.node-item:hover, .node-item.selected { background: var(--panel); }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.ok { background:#22c55e; } .dot.warn { background:#f59e0b; } .dot.bad { background:#ef4444; } .dot.untested { background:#9ca3af; }
main { flex:1; overflow-y:auto; padding: 20px 24px; }
table { width:100%; border-collapse: collapse; font-size:13px; margin-bottom:20px; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.badge { padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; display:inline-block; }
.badge.working, .badge.passed { background:#22c55e; } .badge.broken, .badge.failed { background:#ef4444; }
.badge.untested, .badge.planned { background:#9ca3af; } .badge.unreachable, .badge.partial { background:#f59e0b; }
.badge.missing { background:#a855f7; } .badge.approved, .badge.running { background:var(--accent); } .badge.skipped { background:#6b7280; }
.muted { color:var(--muted); }
.step { padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.step:last-child { border-bottom:none; }
h2 { font-size:14px; margin: 22px 0 8px; }
h2:first-child { margin-top:0; }
code { background:var(--panel); padding:1px 5px; border-radius:4px; font-size:12px; }
details { border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin:6px 0; font-size:13px; }
details summary { cursor:pointer; color:var(--accent); }
.health { font-size:14px; margin: 10px 0 16px; }
.health .big { font-size:22px; font-weight:700; }
.healthline { margin:6px 0; }
.sumbullet { margin:4px 0; }
.verdict-ok { color:#22c55e; } .verdict-warn { color:#f59e0b; } .verdict-bad { color:#ef4444; }
.finding { margin:8px 0; }
.finding h3 { font-size:13px; margin:14px 0 4px; }
.section { display:none; }
.section.active { display:block; }
.projects-layout { display:flex; gap:24px; align-items:flex-start; }
.projects-list { flex:0 0 320px; }
.projects-detail { flex:1; min-width:0; }
.projects-detail pre { max-height:60vh; overflow:auto; background:var(--panel); padding:10px; border-radius:6px; font-size:12px; }
.projects-detail .markdown { line-height:1.5; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { border-bottom:1px solid var(--border); padding-bottom:4px; }
.markdown li { list-style:disc; margin-left:18px; }
.markdown .codeblock { background:var(--panel); padding:8px; border-radius:6px; overflow-x:auto; }
.artifact-open { background:none; border:1px solid var(--border); color:var(--accent); border-radius:6px; padding:3px 10px; cursor:pointer; font-size:12px; }
.artifact-open:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.video { max-width:100%; border:1px solid var(--border); border-radius:6px; }
</style>

low-tester/site/assets/screenshots-_sip_studio_sp3.png","size":137946,"served":"assets/screenshots-_sip_studio_sp3.png"},{"name":"_sip_studio.png","group":"screenshots","kind":"image","relPath":"assets/screenshots-_sip_studio.png","absPath":"/Users/karthiknaig/Projects/ux-flow-tester/site/assets/screenshots-_sip_studio.png","size":90160,"served":"assets/screenshots-_sip_studio.png"},{"name":"_sip.png","group":"screenshots","kind":"image","relPath":"assets/screenshots-_sip.png","absPath":"/Users/karthiknaig/Projects/ux-flow-tester/site/assets/screenshots-_sip.png","size":117696,"served":"assets/screenshots-_sip.png"},{"name":"_terms.png","group":"screenshots","kind":"image","relPath":"assets/screenshots-_terms.png","absPath":"/Users/karthiknaig/Projects/ux-flow-tester/site/assets/screenshots-_terms.png","size":102123,"served":"assets/screenshots-_terms.png"},{"name":"UX-Flow-Tester-Product-Spec (1).md","group":"spec","kind":"markdown","relPath":"../../../ux-flow-tester/spec/UX-Flow-Tester-Product-Spec (1).md","absPath":"/Users/karthiknaig/Projects/ux-flow-tester/spec/UX-Flow-Tester-Product-Spec (1).md","size":12012,"content":"# UX Flow Tester — Product Specification (v1)\n\n**Version:** 1.1  \n**Status:** Draft  \n**Last Updated:** 2026-08-09\n\n---\n\n## 1. Product Vision\n\nUX Flow Tester reverse-engineers a web application to recover its missing interaction specification, then verifies that the live product delivers coherent, complete user flows.\n\nIt is designed for modern SPAs and AI-generated UIs where formal flow specifications are missing, incomplete, or outdated.\n\nThe system treats the **navigation graph as a first-class engineering artifact** (Graph Engineering) and uses reflective optimization (GEPA) to continuously improve its own inference and prioritization modules.\n\n**Long-term vision:** Expand into richer requirement and architecture recovery, continuous monitoring, automated fix suggestions, and self-improving recovery/prioritization via GEPA.  \n**v1 focus:** High-quality navigation & interaction recovery + verification, presented in an interactive, human-in-the-loop experience, with foundational support for Graph Engineering and GEPA.\n\n---\n\n## 2. v1 Goal\n\nGiven a web application (URL + optional codebase), the system must:\n\n1. Recover a usable **Design / Interaction Specification** and **Intended Navigation Graph**\n2. Infer core personas and high-value journeys\n3. Intelligently select important input scenarios (avoid combinatorial explosion)\n4. Verify the live application against recovered navigation contracts\n5. Present progress and results in live, interactive graph/tree views\n6. Support optional manual review gates before expensive runs\n7. Clearly surface:\n   - Broken transitions\n   - Missing return paths\n   - Dead-end states\n   - Major gaps in intended flows\n8. Treat the navigation graph as a versioned, inspectable, diffable artifact\n9. Provide the foundation for GEPA-based optimization of recovery and prioritization modules\n\n---\n\n## 3. v1 Scope\n\n### In Scope\n\n**A. Reverse Engineering (Focused)**\n- Recover screens / major states\n- Recover interactive elements and apparent transitions\n- Build an Intended Navigation Graph as a first-class artifact\n- Infer a small set of core personas and critical journeys\n- Light requirement signal (main user goals)\n\n**B. Specification Synthesis**\n- Turn the recovered interaction model into explicit test contracts\n- Prioritize journeys that matter most\n- Select only important input value combinations\n\n**C. Verification**\n- Execute prioritized paths on the live application (parallel)\n- Detect navigational failures (broken transitions, missing returns, dead ends, unreachable intended states)\n\n**D. Interactive Presentation**\n- Live graph / tree visualization of flows\n- Clickable path explorer (prototype-like)\n- Mindmap / hierarchical views\n- Markdown rendering of plans and recovered specs\n\n**E. Human-in-the-Loop**\n- Optional manual review gates\n- Ability to approve, edit, or reject plans before execution\n\n**F. Graph Engineering Foundations**\n- Explicit, versionable navigation graph\n- Intended vs Actual graph differencing\n- Graph algorithms for coverage, return-path detection, and dead-end finding\n- Graph as the primary object of both computation and UI\n\n**G. GEPA Foundations**\n- Structured feedback from verification runs\n- Design of recovery and synthesis modules as optimizable components\n- Support for offline reflective improvement of prompts/modules\n\n### Out of Scope for v1\n- Full formal Requirement Specification\n- Deep Architecture Specification\n- Visual design critique\n- Accessibility auditing (beyond basic navigation)\n- Performance testing\n- Automatic code fixes or PR generation\n- Native mobile applications\n- Fully automated online GEPA loops in production (foundation only)\n\n---\n\n## 4. Core Workflow\n\n```\n1. Ingest\n   - Application URL (required)\n   - Optional: codebase, existing docs, auth credentials, configuration\n\n2. Recover Interaction Model\n   - Crawl + observe live app\n   - Optionally analyze code (routes, navigation)\n   - Produce: screens/states, transitions, Intended Navigation Graph (versioned)\n   - Infer core personas + critical journeys\n\n3. Synthesize Contracts & Scenarios\n   - Define must-reach states and required transitions/return paths\n   - Prioritize journeys\n   - Select important input scenarios only\n\n4. Optional Review Gate\n   - Present recovered model + planned journeys in Markdown + graph views\n   - User can approve / edit / reject\n\n5. Verify\n   - Execute prioritized paths in parallel\n   - Record actual outcomes vs contracts\n   - Stream progress into live graph\n   - Produce rich traces + feedback for potential GEPA use\n\n6. Analyze & Diff\n   - Compare Intended vs Actual graphs\n   - Detect broken transitions, missing returns, dead ends\n\n7. Report & Explore\n   - Interactive graph with status overlays\n   - Clickable path explorer for interesting/broken flows\n   - Prioritized issue list with evidence\n```\n\n---\n\n## 5. Functional Requirements\n\n### 5.1 Reverse Engineering\nThe system must recover:\n- Screens / major UI states (with screenshots and state signatures)\n- Interactive elements and observed/inferred transitions\n- An Intended Navigation Graph (first-class, versionable)\n- A small set of core personas and critical journeys\n- Light signals of primary user goals\n\nSources: live application (DOM, screenshots, routing, network) + optional codebase + optional existing docs.\n\n### 5.2 Input Scenario Control\n- Detect points where user input affects navigation or downstream state\n- Avoid exhaustive combinatorial explosion\n- Select only high-value input variations using:\n  - Persona/goal importance\n  - Equivalence partitioning & boundaries\n  - Observed impact on reachable states\n  - LLM judgment for minimal high-signal sets\n- Explicitly show which scenarios were chosen and why others were deprioritized\n\n### 5.3 Verification Engine\n- Execute prioritized journeys against the live app\n- Support deterministic steps and goal-oriented agent fallback\n- Record actual transitions, screenshots, and outcomes\n- Detect broken/incorrect transitions, missing return paths, dead ends, and unreachable intended states\n- Emit structured traces and natural-language feedback suitable for GEPA-style reflection\n\n### 5.4 Interactive Presentation\n**Live Graph / Tree View**\n- Nodes = screens/states\n- Edges = user actions\n- Visual status encoding (working / broken / untested / missing return)\n- Clickable nodes and edges for details\n- Filters by persona, priority, issue type\n- Support for viewing Intended vs Actual overlays\n\n**Path Explorer**\n- Step-by-step interactive view of important journeys\n- Screenshots + action taken + expected vs actual\n- Feels like a clickable prototype for interesting/broken paths\n\n**Mindmap / Hierarchical Views**\n- Personas → goals → journeys\n- Product areas → flows\n- Easy navigation between high-level structure and detail\n\n**Markdown Viewer**\n- Clean rendering of recovered specs and planned journeys\n- Support for links into graph nodes/paths\n- Readable structured documents for review gates\n\n### 5.5 Manual Review Gates (Optional)\nUsers can insert approval steps:\n- After reverse engineering (review recovered Interaction Spec + Graph)\n- After prioritization (approve/edit planned journeys and input scenarios)\n- Before large verification runs\n\nActions: Approve / Edit / Reject & regenerate with guidance.\n\n### 5.6 Graph Engineering Requirements\n- The navigation graph is a first-class artifact: versioned, inspectable, diffable, and the primary object of both reasoning and UI.\n- Explicit distinction between Intended Graph and Actual Graph.\n- Graph algorithms used for:\n  - Return-path detection\n  - Dead-end identification\n  - Coverage measurement\n  - Path prioritization support\n- Graph diffs form a core part of the verification report.\n\n### 5.7 GEPA Foundations\n- Recovery and Synthesis modules are designed as optimizable components with clear inputs/outputs.\n- Verification runs produce rich traces + diagnostic feedback (not only scalar scores).\n- The system supports offline GEPA-style reflective optimization of key prompts/modules against a small set of labeled or synthetic apps.\n- Metrics and feedback functions are defined so that improvements in recovery quality and prioritization quality can be measured and optimized.\n\n---\n\n## 6. Non-Functional Requirements\n\n- Works on modern SPAs (client-side routing, dynamic content)\n- Supports authenticated areas (credentials / test accounts)\n- Runnable locally and in CI\n- Parallel path execution\n- Transparent inference (user can inspect why something was inferred or flagged)\n- Graceful handling of incomplete recovered models\n- Real-time or near-real-time updates to the graph during execution\n- Graph artifacts are durable and queryable across runs\n\n---\n\n## 7. Inputs\n\n| Input                        | Required | Purpose                                      |\n|-----------------------------|----------|----------------------------------------------|\n| Application URL             | Yes      | Primary source for recovery and verification |\n| Codebase                    | Optional | Improves recovery of structure and transitions |\n| Existing docs / personas    | Optional | Seeds or corrects recovered model            |\n| Auth credentials            | Optional | Access protected areas                       |\n| Configuration               | Optional | Depth, parallelism, focus areas, review gates |\n\n---\n\n## 8. Outputs\n\n1. Recovered Design / Interaction Specification\n2. Versioned Intended Navigation Graph\n3. Actual Navigation Graph (from execution)\n4. Graph diff (Intended vs Actual)\n5. Inferred personas + prioritized journeys\n6. Selected input scenarios (with rationale)\n7. Live interactive graph and path explorer\n8. Verification Report (issues + evidence)\n9. Structured traces/feedback suitable for GEPA\n10. Optional: generated Playwright tests for critical paths\n\n---\n\n## 9. Success Criteria (v1)\n\nThe product succeeds when it can, with minimal configuration:\n\n- Reconstruct a useful Intended Navigation Graph from a real SPA\n- Identify non-obvious flow problems (especially missing return paths and dead ends)\n- Keep input scenario combinations limited and justified\n- Let users explore flows interactively in graph/tree views\n- Support lightweight optional review gates\n- Treat the graph as a first-class, diffable artifact\n- Produce rich enough traces/feedback to support future GEPA optimization\n- Produce reports and interactive views that teams find immediately actionable\n- Require significantly less manual effort than writing equivalent end-to-end flow tests\n\n---\n\n## 10. Design Principles\n\n- Prefer high-signal navigation issues over exhaustive coverage\n- Recovered models and plans must be inspectable and editable\n- Runtime grounding (real browser execution) is mandatory\n- Prioritization over brute-force exploration\n- Interactive exploration over static reports\n- Human-in-the-loop should feel lightweight, not bureaucratic\n- Transparent reasoning\n- **Graph as first-class artifact** (Graph Engineering)\n- **Modules are optimizable via reflection on full traces** (GEPA-ready)\n\n---\n\n## 11. Future Expansion (Post-v1)\n\n- Richer Requirement recovery\n- Deeper Architecture analysis\n- Continuous / CI monitoring mode\n- Auto-generation of Playwright tests and suggested fixes\n- Multi-role and feature-flag aware exploration\n- Stronger collaborative review features\n- Online or periodic GEPA optimization loops on real customer apps\n- Advanced graph algorithms and embeddings for large applications\n\n---\n\n## 12. Positioning\n\nUX Flow Tester is a **specification recovery + navigational verification system** built on Graph Engineering principles, with an interactive human-in-the-loop interface and a foundation for reflective self-improvement (GEPA).\n\nIt first reconstructs what the product’s flows appear to be (as an explicit graph), lets the user review and refine that understanding, verifies whether the live experience delivers coherent user journeys, and is designed so that its own inference quality can improve over time through reflective optimization.\n"},{"name":"UX-Flow-Tester-Technical-Spec (1).md","group":"spec","kind":"markdown","relPath":"../../../ux-flow-tester/spec/UX-Flow-Tester-Technical-Spec (1).md","absPath":"/Users/karthiknaig/Projects/ux-flow-tester/spec/UX-Flow-Tester-Technical-Spec (1).md","size":17136,"content":"# UX Flow Tester — Technical Specification (v1)\n\n**Version:** 1.1  \n**Status:** Draft  \n**Last Updated:** 2026-08-09  \n**Companion:** UX-Flow-Tester-Product-Spec.md\n\n---\n\n## 1. Overview\n\nThis document defines the technical architecture, data models, pipeline stages, and key interfaces for UX Flow Tester v1.\n\nThe system reverse-engineers a web application’s interaction model, synthesizes prioritized navigation contracts (with controlled input scenarios), optionally pauses for human review, executes verification in parallel, and presents results in interactive graph/tree views.\n\nIt is built on two reinforcing ideas:\n\n- **Graph Engineering**: The navigation graph is a first-class, versioned, diffable artifact that both the system and the user reason over.\n- **GEPA readiness**: Recovery and Synthesis modules are designed as optimizable components that emit rich traces and diagnostic feedback, enabling reflective prompt/system optimization.\n\n---\n\n## 2. High-Level Architecture\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                        UI Layer                             │\n│  Graph Viewer · Path Explorer · Mindmap · Markdown Reviewer │\n│  (Intended vs Actual overlays, version diffs)               │\n└────────────────────────────┬────────────────────────────────┘\n                             │\n┌────────────────────────────▼────────────────────────────────┐\n│                     Orchestrator / API                      │\n│   Pipeline control · Review gates · State machine · GEPA hooks│\n└──────┬──────────┬──────────┬──────────┬──────────┬──────────┘\n       │          │          │          │          │\n       ▼          ▼          ▼          ▼          ▼\n  Recovery   Synthesis  Execution   Analysis   Graph Store\n  Engine     Engine     Engine      Engine     (versioned)\n```\n\n### Major Components\n\n| Component            | Responsibility                                                                 |\n|----------------------|---------------------------------------------------------------------------------|\n| Recovery Engine      | Crawl live app + optional code analysis → Interaction Model + Intended Graph   |\n| Synthesis Engine     | Personas, journeys, contracts, input scenario selection                        |\n| Execution Engine     | Parallel Playwright (or agent) path runners; emit rich traces                  |\n| Analysis Engine      | Intended vs Actual graph diff; detect issues; produce GEPA-ready feedback      |\n| Graph Store          | Versioned nodes, edges, paths, evidence, status; diff support                  |\n| Presentation Layer   | Interactive graph, path explorer, mindmap, markdown viewer                     |\n| Orchestrator         | Pipeline state machine + optional review gates + GEPA optimization hooks       |\n\n---\n\n## 3. Core Data Models\n\n```ts\n// ----- Identity & State -----\n\ninterface Node {\n  id: string;\n  url: string;\n  title?: string;\n  stateSignature: string;          // stable hash of meaningful DOM + key data\n  screenshotPath?: string;\n  isTerminal?: boolean;\n  source: \"observed\" | \"inferred\" | \"code\";\n  metadata?: Record\u003cstring, any>;\n}\n\ninterface Edge {\n  id: string;\n  from: string;                    // Node.id\n  to: string | null;               // null = broken / no navigation observed\n  action: string;                  // human-readable: \"Click 'Checkout'\"\n  selector?: string;\n  inputScenarioId?: string;\n  isReturnPath: boolean;\n  status: \"working\" | \"broken\" | \"untested\" | \"unreachable\" | \"missing\";\n  error?: string;\n  screenshotPath?: string;\n  evidence?: Evidence[];\n}\n\ninterface Evidence {\n  type: \"screenshot\" | \"dom\" | \"network\" | \"console\" | \"log\";\n  pathOrValue: string;\n  timestamp: string;\n}\n\n// ----- Personas & Journeys -----\n\ninterface Persona {\n  id: string;\n  name: string;\n  description: string;\n  goals: string[];\n  traits?: string[];\n  source: \"inferred\" | \"provided\" | \"refined\";\n}\n\ninterface InputScenario {\n  id: string;\n  description: string;\n  values: Record\u003cstring, string | number | boolean>;\n  rationale: string;\n  priority: \"critical\" | \"high\" | \"medium\" | \"low\";\n}\n\ninterface PrioritizedPath {\n  id: string;\n  personaId: string;\n  goal: string;\n  steps: PathStep[];\n  inputScenarioIds?: string[];\n  priority: \"critical\" | \"high\" | \"medium\" | \"low\";\n  reason: string;\n  status: \"planned\" | \"approved\" | \"running\" | \"passed\" | \"failed\" | \"skipped\";\n}\n\ninterface PathStep {\n  action: string;\n  expectedNodeId?: string;\n  actualNodeId?: string;\n  status?: \"pending\" | \"passed\" | \"failed\";\n  evidence?: Evidence[];\n}\n\n// ----- Graph Engineering Artifacts -----\n\ninterface GraphVersion {\n  id: string;\n  type: \"intended\" | \"actual\" | \"merged\";\n  createdAt: string;\n  parentVersionId?: string;\n  nodes: Record\u003cstring, Node>;\n  edges: Edge[];\n  entryPoints: string[];\n  metadata?: Record\u003cstring, any>;\n}\n\ninterface GraphDiff {\n  fromVersionId: string;\n  toVersionId: string;\n  addedNodes: string[];\n  removedNodes: string[];\n  addedEdges: string[];\n  removedEdges: string[];\n  changedEdges: string[];          // status or target changed\n  missingReturnPaths: string[];    // node or edge ids\n  deadEnds: string[];\n}\n\n// ----- Top-level Artifacts -----\n\ninterface InteractionModel {\n  intendedGraph: GraphVersion;\n  actualGraph?: GraphVersion;\n  diff?: GraphDiff;\n  recoveredAt: string;\n  sources: (\"live\" | \"code\" | \"docs\")[];\n}\n\ninterface VerificationReport {\n  summary: {\n    nodesCovered: number;\n    edgesCovered: number;\n    brokenTransitions: number;\n    missingReturnPaths: number;\n    deadEnds: number;\n  };\n  issues: Issue[];\n  graphDiff?: GraphDiff;\n  generatedAt: string;\n}\n\ninterface Issue {\n  id: string;\n  type: \"broken_transition\" | \"missing_return\" | \"dead_end\" | \"unreachable\" | \"spec_deviation\";\n  severity: \"critical\" | \"high\" | \"medium\" | \"low\";\n  title: string;\n  description: string;\n  nodeIds?: string[];\n  edgeIds?: string[];\n  pathId?: string;\n  evidence?: Evidence[];\n}\n\n// ----- GEPA Support -----\n\ninterface TraceFeedback {\n  runId: string;\n  module: \"recovery\" | \"synthesis\" | \"prioritization\" | \"diagnosis\";\n  score: number;                   // scalar for ranking\n  feedback: string;                // rich natural-language diagnosis\n  traceSummary: string;            // key steps / observations\n  examples?: any[];                // supporting evidence\n}\n```\n\n---\n\n## 4. Pipeline Stages\n\n### Stage 1 — Ingest\n- Accept URL (required), optional codebase path, docs, credentials, config.\n- Normalize configuration (max depth, parallel workers, review gates on/off, focus areas).\n\n### Stage 2 — Recovery\n**Live recovery**\n- Playwright-based crawler (BFS or guided).\n- For each state: capture URL, title, screenshot, state signature, interactive elements.\n- Record observed transitions.\n- Handle basic auth and simple session setup.\n\n**Code recovery (optional)**\n- Parse routes (Next.js, React Router, etc.).\n- Extract navigation calls and major page components.\n- Merge with live observations.\n\n**Output:** Versioned `Intended Graph` + initial `InteractionModel`\n\n### Stage 3 — Synthesis\n- Infer or refine 3–7 core personas.\n- Generate prioritized journeys per persona.\n- Detect input-sensitive points and select a minimal high-value set of `InputScenario`s.\n- Produce explicit navigation contracts.\n- Attach rationale to every prioritized path and input scenario.\n\n**Output:** Personas, `PrioritizedPath[]`, `InputScenario[]`, contracts\n\n### Stage 4 — Optional Review Gate\n- Persist current plan as Markdown + graph snapshot.\n- Expose UI for user to inspect, edit, approve, or reject.\n- On reject: accept free-text guidance and re-run synthesis (or parts of it).\n- State machine: `draft → under_review → approved → executing`\n\n### Stage 5 — Execution\n- Parallel workers (configurable).\n- Each worker executes one `PrioritizedPath` sequentially.\n- On every step: perform action, capture state + screenshot, record actual edge, update graph store live.\n- Emit structured traces suitable for later reflection.\n\n### Stage 6 — Analysis (Graph Engineering core)\n- Build or update the **Actual Graph**.\n- Compute **GraphDiff** (Intended vs Actual).\n- Detect:\n  - Broken transitions\n  - Missing return paths (graph algorithm)\n  - Dead-end nodes\n  - Unreachable intended nodes\n- Generate `Issue[]` with severity and evidence.\n- Produce `TraceFeedback` objects for GEPA.\n\n### Stage 7 — Presentation\n- Stream updates to the interactive graph during execution.\n- Final views:\n  - Full navigation graph with status and Intended/Actual overlays\n  - Graph diff visualization\n  - Filterable issue list\n  - Path explorer\n  - Mindmap of personas → goals → journeys\n  - Markdown report export\n\n---\n\n## 5. Graph Engineering Layer\n\n### 5.1 Principles\n- The navigation graph is the primary artifact of both computation and user interaction.\n- Intended and Actual graphs are first-class and versioned.\n- Diffs are explicit and queryable.\n- Classical graph algorithms are used for structural properties (returns, dead ends, coverage).\n\n### 5.2 Key Operations\n- `createVersion(type, nodes, edges)` → GraphVersion\n- `diff(intended, actual)` → GraphDiff\n- `findMissingReturnPaths(graph)` → list of nodes/edges\n- `findDeadEnds(graph)` → list of nodes\n- `computeCoverage(intended, actual)` → metrics\n- `highlightPath(graph, pathId)` for UI\n\n### 5.3 UI Implications\n- Graph Viewer must support version selection and overlay (Intended vs Actual).\n- Diffs should be visually scannable (added/removed/changed edges and nodes).\n- Users can click from an issue directly into the relevant graph region.\n\n---\n\n## 6. GEPA Integration (Foundations)\n\n### 6.1 Design Goals\n- Recovery and Synthesis are written as clear modules with typed inputs/outputs.\n- Every verification run can emit `TraceFeedback` containing:\n  - Scalar score (for ranking)\n  - Natural-language diagnosis of what went wrong or right\n  - Compact trace summary\n- Offline GEPA loops can optimize the prompts/instructions of these modules against a small training set of apps or synthetic cases.\n\n### 6.2 Example Feedback Targets\n- Recovery quality: “Did the recovered graph capture the known critical screens and transitions?”\n- Prioritization quality: “Did the selected journeys include the known broken flows while staying within budget?”\n- Diagnosis quality: “Are missing return paths and dead ends correctly identified and explained?”\n\n### 6.3 Future Online Use\nPost-v1, the same feedback channel can support periodic or continuous reflective improvement on real customer workloads (with appropriate privacy and control).\n\n---\n\n## 7. Presentation Layer Requirements\n\n### 7.1 Graph Viewer\n- Technology suggestion: Cytoscape.js, React Flow, or equivalent.\n- Features:\n  - Zoom, pan, search\n  - Click node/edge → details + evidence\n  - Color / stroke encoding for status and priority\n  - Intended vs Actual overlay or side-by-side\n  - Version switching and diff highlighting\n  - Live updates while execution is running\n  - Filter by persona, priority, status, issue type\n\n### 7.2 Path Explorer\n- Sequential, prototype-like view.\n- Screenshot + action + expected vs actual per step.\n- Jump links into the graph.\n\n### 7.3 Mindmap / Hierarchical View\n- Personas → goals → journeys → key screens.\n\n### 7.4 Markdown Viewer\n- Render recovered specs, planned journeys, and reports.\n- Internal links to graph nodes/paths.\n- Clean typography for review sessions.\n\n---\n\n## 8. Input Scenario Control (Technical)\n\n1. Identify forms/controls that influence navigation or major state.\n2. Propose candidate partitions (empty, valid typical, invalid, boundary, persona-relevant).\n3. Score combinations by impact, persona relevance, and likelihood of exposing issues.\n4. Keep only a budgeted set per journey.\n5. Store and surface rationale.\n6. Feed selection quality into GEPA feedback when optimizing the synthesis module.\n\n---\n\n## 9. Review Gate State Machine\n\n```\ndraft\n  → under_review\n      → approved\n      → rejected          (feedback → synthesis or draft)\napproved\n  → executing\n      → completed\n      → failed\n```\n\n---\n\n## 10. Suggested Technology Stack (v1)\n\n| Layer              | Suggestion                                      |\n|--------------------|-------------------------------------------------|\n| Runtime            | Node.js + TypeScript                            |\n| Browser automation | Playwright                                      |\n| Optional agents    | Playwright Test Agents / browser-use / Midscene |\n| LLM                | Claude / OpenAI / local (via abstraction)       |\n| Optimization       | DSPy + GEPA (for offline module improvement)    |\n| Graph storage      | SQLite or JSON + in-memory; versioned artifacts |\n| Graph visualization| Cytoscape.js or React Flow                      |\n| UI                 | React / Next.js                                 |\n| Markdown           | MDX or standard markdown renderer               |\n| API                | Simple REST or tRPC                             |\n| Parallelism        | Playwright workers or job queue                 |\n\n---\n\n## 11. Key Interfaces (Sketch)\n\n```ts\ninterface RecoveryEngine {\n  recover(options: RecoveryOptions): Promise\u003cInteractionModel>;\n}\n\ninterface SynthesisEngine {\n  synthesize(model: InteractionModel, options: SynthesisOptions): Promise\u003c{\n    personas: Persona[];\n    paths: PrioritizedPath[];\n    scenarios: InputScenario[];\n    contracts: Contract[];\n  }>;\n}\n\ninterface ExecutionEngine {\n  execute(paths: PrioritizedPath[], options: ExecutionOptions): AsyncIterable\u003cExecutionEvent>;\n}\n\ninterface AnalysisEngine {\n  analyze(intended: GraphVersion, actual: GraphVersion, results: ExecutionResult[]): {\n    report: VerificationReport;\n    feedback: TraceFeedback[];\n  };\n}\n\ninterface GraphStore {\n  saveVersion(graph: GraphVersion): string;\n  getVersion(id: string): GraphVersion;\n  diff(a: string, b: string): GraphDiff;\n  // live query helpers for the UI\n}\n```\n\n---\n\n## 12. Configuration (Example)\n\n```yaml\nurl: https://staging.example.com\ncodebase: ./apps/web\nauth:\n  strategy: storage_state\n  storageStatePath: ./auth.json\nlimits:\n  maxNodes: 150\n  maxDepth: 6\n  parallelWorkers: 6\n  maxInputScenariosPerPath: 4\nreviewGates:\n  afterRecovery: true\n  afterSynthesis: true\ngraph:\n  versioning: true\n  retainVersions: 20\ngepa:\n  enabled: false          # offline optimization only in v1\n  feedbackCapture: true\nllm:\n  provider: anthropic\n  model: claude-sonnet-5\n```\n\n---\n\n## 13. Implementation Order (Recommended)\n\n1. Project setup + core data models + versioned Graph Store\n2. Basic Playwright crawler (Recovery Engine – live only)\n3. Simple Synthesis (personas + paths) with LLM\n4. Single-path executor + parallel wrapper\n5. Analysis with GraphDiff + missing-return / dead-end detection\n6. Graph visualization (static → live updates + Intended/Actual)\n7. Path Explorer + Markdown report\n8. Input scenario selection logic\n9. Review gate state machine + UI\n10. TraceFeedback emission (GEPA foundation)\n11. Code-assisted recovery\n12. Offline GEPA experimentation harness\n13. Polish, CI mode, export\n\n---\n\n## 14. Open Technical Risks & Mitigations\n\n| Risk                              | Mitigation                                              |\n|-----------------------------------|---------------------------------------------------------|\n| Low-quality recovered model       | Inspectable/editable graph; user correction; GEPA later |\n| Combinatorial input explosion     | Strict budgeting + rationale + GEPA on selection logic  |\n| Flaky live execution              | Retries, stable state signatures, clear evidence        |\n| Auth & stateful areas             | Explicit auth setup + storage state support             |\n| LLM non-determinism in planning   | Structured outputs, review gates, later GEPA            |\n| Graph UI performance              | Clustering / pagination for large graphs                |\n| Version explosion                 | Retention policy + prune old versions                   |\n\n---\n\n## 15. Success Metrics (Technical)\n\n- Can recover a usable navigation graph from a real SPA with reasonable compute\n- Input scenarios per critical path stay within budget\n- Review gates remain lightweight\n- Interactive graph remains responsive for typical app sizes\n- Clear evidence attached to every reported issue\n- GraphDiff correctly surfaces missing returns and dead ends\n- TraceFeedback is sufficiently diagnostic for offline GEPA experiments\n\n---\n\nThis technical specification is implementation-ready and explicitly incorporates Graph Engineering and GEPA foundations.\n"}];
